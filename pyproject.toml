[project]
name = "llm-vlm-agents-course"
version = "0.1.0"
description = "Student starter for the Designing LLM/VLM Agents course"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "openai>=1.100,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_course"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
